name: build.yml
on:
  push:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build step
        run: npm run build

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup runner
        uses: pguyot/arm-runner-action@v2

      - name: Build the Docker Image
        run: |
          uname -m
          docker build . --platform linux/arm64 --tag archi-back:latest
          docker save archi-back:latest > archi-back.tar